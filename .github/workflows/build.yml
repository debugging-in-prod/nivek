name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, prod]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare production environment
        run: /home/deploy/actions-runner/env-setup.sh

      # Must stay the LAST step (issue #248). This workflow shares the runner
      # workspace with deploy-prod.yml, and the checkout above cleans the
      # gitignored bin/ -- deleting bin/twitch-bot, which the twitch-bot
      # systemd unit runs (ExecStart path unchanged). Put it back from the
      # canonical copy outside the checkout.
      #
      # Always rebuild the canonical copy from this checkout first (issue
      # #256). Both deploy workflows share the production-deploy concurrency
      # group, so a pending run can be cancelled when pushes land close
      # together. If the cancelled run were the only one building the binary,
      # the bot would be left on an older commit. So each deploy workflow
      # builds the binary for its own commit, with the same atomic
      # build-then-rename as deploy-prod.yml.
      #
      # If the build fails, keep the previous canonical binary, still install
      # it into bin/ (so bin/ is never left empty), then fail the step so the
      # run is red. Runs even if env-setup failed. Does not restart anything.
      - name: Install twitch-bot binary into checkout
        if: success() || failure()
        run: |
          set -euo pipefail
          SRC=/home/deploy/nivek-bin/twitch-bot
          DST="$GITHUB_WORKSPACE/bin/twitch-bot"
          BUILD_FAILED=0
          mkdir -p /home/deploy/nivek-bin
          if /usr/local/go/bin/go build -o /home/deploy/nivek-bin/twitch-bot.new ./cmd/twitch-bot; then
            mv -f /home/deploy/nivek-bin/twitch-bot.new /home/deploy/nivek-bin/twitch-bot
          else
            BUILD_FAILED=1
            rm -f /home/deploy/nivek-bin/twitch-bot.new
            echo "::error::twitch-bot build failed; installing the previous canonical binary"
          fi
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp -f "$SRC" "$DST.new"
          chmod 755 "$DST.new"
          mv -f "$DST.new" "$DST"
          test -x "$DST"
          ls -l "$DST"
          if [ "$BUILD_FAILED" -ne 0 ]; then
            exit 1
          fi
