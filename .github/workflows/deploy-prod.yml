name: Prod Service Deployment

on:
  push:
    branches:
      - main
    # Optional: limit triggers to certain paths if you want
    # paths:
    #   - 'cmd/core-api/**'
    #   - 'internal/**'
    #   - 'pkg/**'
    #   - 'go.mod'
    #   - 'go.sum'

permissions:
  contents: write

# Same group as build.yml ("Deploy Production"). Both workflows fire on push
# to main, run on the same self-hosted runner and share one checkout
# workspace, so they must never overlap: one run's actions/checkout cleans the
# gitignored bin/ that the other just populated (issue #248). Queue, never
# cancel, so every push still deploys.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pull:
    runs-on: [self-hosted, linux, prod]  # Vultr runner labels

    steps:
      - name: Checkout repository (default workspace)
        uses: actions/checkout@v4

      - name: List pulled files (sanity check)
        run: |
          echo "Repository pulled to runner workspace"
          pwd
          ls -la
  deploy:
    needs: pull
    runs-on: [self-hosted, linux, prod]

    steps:
      # Stamp the short commit SHA into the Nuxt bundle so the footer build
      # tag reflects what was actually deployed. Overwrites the committed
      # 'dev' placeholder before env-setup.sh kicks off the docker build.
      - name: Stamp build version
        run: |
          SHA=$(git rev-parse --short HEAD)
          cat > nivek-nuxt/app/utils/version.ts <<EOF
          export const BUILD_VERSION = '${SHA}'
          EOF

      - name: Env Setup
        run: /home/deploy/actions-runner/env-setup.sh

      # Rebuild the twitch-bot host-daemon binary (issue #248).
      #
      # The canonical copy lives OUTSIDE the checkout, at
      # /home/deploy/nivek-bin/twitch-bot. bin/ inside the workspace is
      # gitignored, and actions/checkout (in this workflow AND in build.yml,
      # which shares this workspace) cleans it, so a binary that only lived in
      # bin/ could vanish and the next bot restart would fail with 203/EXEC.
      #
      # Build to a temp name, then rename: the rename is atomic and swaps the
      # directory entry, so it never hits "text file busy" while the old
      # binary is running and nothing ever sees a half-written file.
      #
      # The systemd unit still runs $GITHUB_WORKSPACE/bin/twitch-bot (that
      # path is unchanged); the "Install twitch-bot binary into checkout" step
      # at the end of this job (and of build.yml's job) copies the canonical
      # binary there. Nothing here restarts the daemon; that stays a manual
      # step so the bot is only bounced intentionally.
      - name: Build twitch-bot binary
        run: |
          set -euo pipefail
          mkdir -p /home/deploy/nivek-bin
          /usr/local/go/bin/go build -o /home/deploy/nivek-bin/twitch-bot.new ./cmd/twitch-bot
          mv -f /home/deploy/nivek-bin/twitch-bot.new /home/deploy/nivek-bin/twitch-bot

      # Post-deploy smoke check (incident #172). Read-only: GET requests to the
      # public API only, no restarts, nothing secret is sent or printed.
      # /api/healthz (retried, to ride out the container rollout) proves
      # core-api is up. /api/commands is a public route backed by a DB query
      # (GetGlobalEnabledCommands) -- the one that 500'd with stale cached
      # statements (08P01) in #172. It is NOT retried (curl --retry also
      # retries 500s, which would mask an intermittent failure) and is hit
      # several times so it lands on more than one pooled connection. Any
      # non-2xx fails the job.
      - name: Smoke check core-api
        env:
          CORE_API_BASE_URL: ${{ vars.CORE_API_BASE_URL || 'https://peanutbudderbot.com/api' }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null --max-time 10 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            -w "%{http_code} /healthz\n" "${CORE_API_BASE_URL}/healthz"
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null --max-time 10 \
              -w "%{http_code} /commands\n" "${CORE_API_BASE_URL}/commands"
          done

      # Must stay the LAST step. Copies the canonical binary into the
      # checkout's bin/ (the systemd ExecStart path). Runs even if the smoke
      # check (or the build) failed, so bin/ is never left empty: if the build
      # failed, the previous canonical binary is installed. Does not restart
      # anything.
      - name: Install twitch-bot binary into checkout
        if: success() || failure()
        run: |
          set -euo pipefail
          SRC=/home/deploy/nivek-bin/twitch-bot
          DST="$GITHUB_WORKSPACE/bin/twitch-bot"
          if [ -f "$SRC" ]; then
            mkdir -p "$GITHUB_WORKSPACE/bin"
            cp -f "$SRC" "$DST.new"
            chmod 755 "$DST.new"
            mv -f "$DST.new" "$DST"
          fi
          test -x "$DST"
          ls -l "$DST"
