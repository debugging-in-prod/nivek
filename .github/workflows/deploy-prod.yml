name: Prod Service Deployment

on:
  push:
    branches:
      - main
    # Optional: limit triggers to certain paths if you want
    # paths:
    #   - 'cmd/core-api/**'
    #   - 'internal/**'
    #   - 'pkg/**'
    #   - 'go.mod'
    #   - 'go.sum'

permissions:
  contents: write

jobs:
  pull:
    runs-on: [self-hosted, linux, prod]  # Vultr runner labels

    steps:
      - name: Checkout repository (default workspace)
        uses: actions/checkout@v4

      - name: List pulled files (sanity check)
        run: |
          echo "Repository pulled to runner workspace"
          pwd
          ls -la
  deploy:
    needs: pull
    runs-on: [self-hosted, linux, prod]

    steps:
      # Stamp the short commit SHA into the Nuxt bundle so the footer build
      # tag reflects what was actually deployed. Overwrites the committed
      # 'dev' placeholder before env-setup.sh kicks off the docker build.
      - name: Stamp build version
        run: |
          SHA=$(git rev-parse --short HEAD)
          cat > nivek-nuxt/app/utils/version.ts <<EOF
          export const BUILD_VERSION = '${SHA}'
          EOF

      - name: Env Setup
        run: /home/deploy/actions-runner/env-setup.sh

      # Rebuild the twitch-bot host-daemon binary. git clean (-x) wipes the
      # gitignored bin/ on every deploy, so without this the binary would be
      # missing until manually rebuilt — a running bot survives the delete
      # (Linux keeps the open inode) but the NEXT restart would fail to find it.
      # Building here does not restart the daemon; that stays a manual step so
      # the bot is only bounced intentionally.
      - name: Build twitch-bot binary
        run: /usr/local/go/bin/go build -o bin/twitch-bot ./cmd/twitch-bot

      # Post-deploy smoke check (incident #172). Read-only: GET requests to the
      # public API only, no restarts, nothing secret is sent or printed.
      # /api/healthz (retried, to ride out the container rollout) proves
      # core-api is up. /api/commands is a public route backed by a DB query
      # (GetGlobalEnabledCommands) -- the one that 500'd with stale cached
      # statements (08P01) in #172. It is NOT retried (curl --retry also
      # retries 500s, which would mask an intermittent failure) and is hit
      # several times so it lands on more than one pooled connection. Any
      # non-2xx fails the job.
      - name: Smoke check core-api
        env:
          CORE_API_BASE_URL: ${{ vars.CORE_API_BASE_URL || 'https://peanutbudderbot.com/api' }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null --max-time 10 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            -w "%{http_code} /healthz\n" "${CORE_API_BASE_URL}/healthz"
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null --max-time 10 \
              -w "%{http_code} /commands\n" "${CORE_API_BASE_URL}/commands"
          done
